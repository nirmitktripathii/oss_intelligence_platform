version: "3.8"

# =============================================================================
# GitScout / OSS Terminal: Turnkey Full-Stack Local Orchestration
# Services:
#   1. frontend  (Next.js 14 Developer Dashboard - Port 3000)
#   2. backend   (FastAPI Intelligence API - Port 8000)
#   3. db        (PostgreSQL 16 Relational Store - Port 5432)
#   4. redis     (Redis 7 In-Memory Cache - Port 6379)
#
# Quickstart:
#   docker compose up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Frontend: Next.js 14 Developer Dashboard & Theme Engine
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: gitscout_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_DODO_ENVIRONMENT=${DODO_ENVIRONMENT:-test_mode}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gitscout_network

  # ---------------------------------------------------------------------------
  # 2. Backend: FastAPI High-Throughput Intelligence & Triage Engine
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: gitscout_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - PROJECT_NAME=GitScout / OSS Terminal
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql+asyncpg://gitscout_user:gitscout_pass@db:5432/gitscout
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000
      - RATE_LIMIT_DEFAULT=120/minute
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DODO_PAYMENTS_API_KEY=${DODO_PAYMENTS_API_KEY:-}
      - DODO_PAYMENTS_WEBHOOK_KEY=${DODO_PAYMENTS_WEBHOOK_KEY:-}
      - LEMON_SQUEEZY_API_KEY=${LEMON_SQUEEZY_API_KEY:-}
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gitscout_network

  # ---------------------------------------------------------------------------
  # 3. Database: PostgreSQL 16 Primary Relational Store
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: gitscout_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=gitscout
      - POSTGRES_USER=gitscout_user
      - POSTGRES_PASSWORD=gitscout_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitscout_user -d gitscout"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gitscout_network

  # Aliased service name for compatibility
  postgres:
    extends:
      service: db
    profiles:
      - alias-postgres

  # ---------------------------------------------------------------------------
  # 4. In-Memory Cache: Redis 7 High-Speed Caching & Rate Limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gitscout_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - gitscout_network

# =============================================================================
# Persistent Storage Volumes & Network Topology
# =============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gitscout_network:
    driver: bridge
