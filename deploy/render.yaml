# Render Infrastructure-as-Code Blueprint
# GitScout / OSS Terminal: High-Performance Open-Source Issue Intelligence Platform
# Architecture: FastAPI Web Service (REST API) + Background Scraping Worker
# Zero-Cost Tier Specification ($0/mo initial operating cost)

services:
  # 1. FastAPI Core Web Service
  - type: web
    name: gitscout-api
    env: python
    region: oregon # us-west / oregon free tier
    plan: free
    branch: main
    rootDir: .
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "GitScout / OSS Terminal"
      - key: VERSION
        value: "1.0.0"
      - key: API_V1_STR
        value: "/api/v1"
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard: postgresql+asyncpg://<user>:<password>@<neon_host>.neon.tech/gitscout?sslmode=require
      - key: CORS_ORIGINS
        value: "https://oss-intelligence-platform.vercel.app,https://gitscout.dev,http://localhost:3000"
      - key: RATE_LIMIT_DEFAULT
        value: "120/minute"
      - key: GITHUB_TOKEN
        sync: false # Optional GitHub PAT for 5,000 req/hr rate limit
      - key: GITHUB_API_BASE
        value: "https://api.github.com"
      - key: SCRAPE_INTERVAL_MINUTES
        value: "30"
      - key: DEFAULT_REPO_LIMIT
        value: "20"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "alerts@gitscout.dev"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_ENVIRONMENT
        value: "test_mode"
      - key: LEMON_SQUEEZY_API_KEY
        sync: false
      - key: LEMON_SQUEEZY_STORE_ID
        sync: false
      - key: LEMON_SQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: "https://oss-intelligence-platform.vercel.app"
      # Agent planner (Developer Mission Control). Dormant until this is set. The URL must be
      # the gitscout-mcp service below; only read-only tools are auto-approved, everything
      # else pauses for the user's confirmation.
      # gitci needs GITCI_MCP_TOKEN here too (same value as on the gitci-mcp service); the token is
      # read from the environment, never from this JSON. Only its read-only tools are auto-approved.
      - key: AGENT_MCP_SERVERS
        value: '[{"name": "gitscout", "url": "https://gitscout-mcp.onrender.com/mcp", "auto_approve": ["search_issues", "get_issue", "analyze_issue", "analyze_issue_text", "gitscout_health"]}, {"name": "gitci", "url": "https://gitci-mcp.onrender.com/mcp", "bearer_env": "GITCI_MCP_TOKEN", "auto_approve": ["sandbox_status", "list_files", "read_file", "show_diff", "ci_status"]}]'
      - key: GITCI_MCP_TOKEN
        sync: false
      # A mission that fixes a bug takes about a dozen tool calls.
      - key: AGENT_MAX_STEPS
        value: "14"
      - key: AGENT_RATE_LIMIT
        value: "10/minute"
      # Sign-in (GitHub OAuth). Tools that change things need a signed-in user on the allow-list;
      # without these the agent stays read-only. Set the values in the dashboard; see
      # docs/DEMO-approval-gate.md ("Sign-in").
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_GITHUB_CLIENT_ID
        sync: false
      - key: AUTH_GITHUB_CLIENT_SECRET
        sync: false
      - key: AUTH_GITHUB_CALLBACK_URL
        value: "https://gitscout-api.onrender.com/api/v1/auth/github/callback"
      - key: AUTH_ALLOWED_LOGINS
        value: "nirmitktripathii"
      # Amazon Bedrock (Nova) provider. Paste the Bedrock API key in the Render dashboard;
      # never commit it. Leaving it unset keeps Bedrock dormant and Gemini answering.
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false
      - key: BEDROCK_REGION
        value: "us-east-1"
      # Missions and sessions live in Redis (shared by both workers); without it a request can
      # land on a worker that never saw the mission.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  # 1b. GitScout MCP server (Streamable HTTP) — the tool surface the agent planner and any
  # other MCP client (Alexa+, Claude, Cursor) connect to. A thin read-only client over the
  # REST API above; holds no secrets and no database access.
  - type: web
    name: gitscout-mcp
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: mcp_server
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    # MCP_HOST=0.0.0.0 matters: the SDK only enforces its localhost-only Host-header allowlist
    # when bound to loopback, which would reject the public hostname.
    startCommand: "MCP_PORT=$PORT python -m gitscout_mcp.server"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MCP_HOST
        value: "0.0.0.0"
      - key: GITSCOUT_API_BASE
        value: "https://gitscout-api.onrender.com/api/v1"

  # 1c. Git/CI MCP server: clones an allow-listed repo into a sandbox, edits, runs its tests, pushes
  # a branch and opens a DRAFT pull request. It runs that repo's tests, so GITCI_ALLOWED_OWNERS
  # must only ever name accounts you control. Every request needs GITCI_MCP_TOKEN, so only the
  # agent backend (behind sign-in and the approval gate) can reach it; it refuses to start without
  # one. GITHUB_TOKEN should be a fine-grained token limited to the demo repo.
  - type: web
    name: gitci-mcp
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: git_ci_mcp
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "MCP_PORT=$PORT python -m gitci_mcp.server"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MCP_HOST
        value: "0.0.0.0"
      - key: GITCI_ALLOWED_OWNERS
        value: "nirmitktripathii"
      - key: GITCI_AUTHOR_NAME
        value: "Mission Control Bot"
      - key: GITCI_AUTHOR_EMAIL
        value: "mission-control@users.noreply.github.com"
      - key: GITCI_MCP_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # 2. Background Scraper & AST Triage Worker
  - type: worker
    name: gitscout-scraper-worker
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: .
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt"
    startCommand: "python -m app.scrapers.orchestrator --seed-live --limit-per-repo 5"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        fromService:
          type: web
          name: gitscout-api
          envVarKey: DATABASE_URL
      - key: GITHUB_TOKEN
        fromService:
          type: web
          name: gitscout-api
          envVarKey: GITHUB_TOKEN
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: gitscout-api
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: DISCORD_WEBHOOK_URL
        fromService:
          type: web
          name: gitscout-api
          envVarKey: DISCORD_WEBHOOK_URL
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: gitscout-api
          envVarKey: RESEND_API_KEY
