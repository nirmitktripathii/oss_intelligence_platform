# Fly.io Edge Deployment Blueprint
# GitScout / OSS Terminal: FastAPI Backend Container
# $0 Zero-Cost Architecture (Fly Machines auto-stop/auto-start)

app = "gitscout-backend"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "../Dockerfile"
  ignorefile = "../.dockerignore"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  PORT = "8000"
  PROJECT_NAME = "GitScout / OSS Terminal"
  VERSION = "1.0.0"
  API_V1_STR = "/api/v1"
  RATE_LIMIT_DEFAULT = "120/minute"
  DODO_ENVIRONMENT = "test_mode"
  RESEND_FROM_EMAIL = "alerts@gitscout.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 300

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/v1/health"
    protocol = "http"
    restart_limit = 3

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Mount persistent volume if local SQLite/cache storage is used (optional fallback)
# [mounts]
#   source = "gitscout_data"
#   destination = "/data"
